name: Lint and test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "1 1 * * *"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Git clone repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run Astro check
        run: npm run check

      - name: Lint
        run: npm run lint

  build-site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Git clone repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install uv
        run: pipx install uv

      - name: Install Python dependencies
        run: uv sync

      - name: Restore Astro cache
        id: restore-astro-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-

      - name: Build site
        run: |
          source .venv/bin/activate
          npm run build
          tar -czvf /tmp/site.tar.gz dist/

      - name: Save Astro cache
        if: ${{ github.event_name != 'pull_request' && steps.restore-astro-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: node_modules/.astro
          key: ${{ steps.restore-astro-cache.outputs.cache-primary-key }}

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: /tmp/site.tar.gz
          retention-days: 1

      - name: Build site for production
        env:
          UMAMI_ID: ${{ secrets.UMAMI_ID }}
        run: |
          source .venv/bin/activate
          npm run build
          tar -czvf /tmp/site-prod.tar.gz dist/

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: site-prod
          path: /tmp/site-prod.tar.gz
          retention-days: 1

  get-playwright-version:
    name: Get Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Git clone repository
        uses: actions/checkout@v7

      - id: get-version
        name: Get Playwright version
        run: |
          echo "version=$(python scripts/get_playwright_version.py)" >> "$GITHUB_OUTPUT"

  test-e2e:
    name: Run e2e tests
    runs-on: ubuntu-latest
    needs:
      - build-site
      - get-playwright-version
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}
    steps:
      - name: Git clone repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: /tmp

      - name: Unpack site
        run: tar -xzf /tmp/site.tar.gz

      - name: Run e2e tests
        run: npm exec --no -- playwright test
        env:
          HOME: /root

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results
          path: test/e2e/output

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      deployments: write
    needs:
      - build-site
      - lint
      - test-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-prod
          path: /tmp

      - name: Unpack site
        run: tar -xzf /tmp/site-prod.tar.gz

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=blog-yuo-be
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
